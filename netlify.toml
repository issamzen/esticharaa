[build]
  command = "npm install --no-audit --no-fund && npm run build && cd admin && npm install --no-audit --no-fund && npm run build"
  publish = "dist"

# Admin dashboard SPA routes
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "22.20.0"
  NITRO_PRESET = "netlify"
