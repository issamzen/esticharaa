[build]
  command = "bun run build && cd admin && bun install && bun run build"
  publish = "dist"

# Admin dashboard (single-page app under /admin)
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "22.20.0"
  BUN_VERSION = "1.3.14"
  NITRO_PRESET = "netlify"
